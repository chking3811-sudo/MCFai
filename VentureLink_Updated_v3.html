<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b4e">
  <title>VentureLink | Build the right connections</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f8fb}iframe{display:block;width:100%;min-height:100vh;border:0}
    #loadError{display:none;max-width:680px;margin:12vh auto;padding:24px;color:#172b45;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;border:1px solid #e1e8f1;border-radius:14px}
  </style>
</head>
<body>
  <iframe id="website" title="VentureLink website"></iframe>
  <main id="loadError" role="alert"><h1>VentureLink could not load</h1><p>Please refresh this page or check your internet connection.</p></main>
  <script>
    const source = 'https://raw.githubusercontent.com/chking3811-sudo/MCFai/458e8ee1afe7129313867584096341304b73ee7f/VentureLink_Updated_v3.html';
    const sheetUrl = 'https://sheetdb.io/api/v1/tp4g3dvbqo7ro?sheet=Sheet1';
    const frame = document.querySelector('#website');
    const showLoadError = () => {
      frame.hidden = true;
      document.querySelector('#loadError').style.display = 'block';
    };
    const normalize = value => String(value ?? '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    const getField = (row, candidates) => {
      const entries = Object.entries(row || {});
      for (const candidate of candidates) {
        const match = entries.find(([key]) => normalize(key) === normalize(candidate));
        if (match && String(match[1] ?? '').trim()) return String(match[1]).trim();
      }
      return '';
    };
    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

    fetch(source).then(response => {
      if (!response.ok) throw new Error('Website source unavailable');
      return response.text();
    }).then(html => {
      // A top-level var is accessible on the iframe window so the fetched data can replace it.
      html = html.replace('const sampleProfiles=[', 'var sampleProfiles=[];\n    /* profiles loaded from SheetDB */\n    var unusedSampleProfiles=[');
      // Remove the original array initializer entirely, including the temporary empty array above.
      html = html.replace(/var sampleProfiles=\[\];\n    \/\* profiles loaded from SheetDB \*\/\n    var unusedSampleProfiles=\[[\s\S]*?\n    \];/, 'var sampleProfiles = [];');

      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          const win = frame.contentWindow;
          const inboxButton = doc.querySelector('#inboxBtn');
          const nav = doc.querySelector('.navlinks');
          if (!inboxButton || !nav) throw new Error('Website navigation unavailable');

          const messaging = doc.createElement('a');
          messaging.href = '#messaging';
          messaging.textContent = 'Messaging';
          messaging.setAttribute('aria-label', 'Open Messaging inbox');
          messaging.addEventListener('click', event => {
            event.preventDefault();
            inboxButton.click();
          });
          nav.append(messaging);

          fetch(sheetUrl).then(response => {
            if (!response.ok) throw new Error('Unable to load profiles from SheetDB.');
            return response.json();
          }).then(rows => {
            if (!Array.isArray(rows)) throw new Error('SheetDB returned an unexpected response.');
            const profiles = rows.map((row, index) => ({
              id: getField(row, ['id', 'profile id', 'business id']) || 'sheet-' + index,
              name: getField(row, ['name', 'company name', 'business name', 'organization', 'full name', 'profile name']),
              type: getField(row, ['type', 'connection type', 'profile type', 'role', 'category']) || 'Connection',
              industry: getField(row, ['industry', 'sector', 'business industry']) || 'Other',
              location: getField(row, ['location', 'city', 'address', 'region']) || 'Not specified',
              description: getField(row, ['description', 'about', 'bio', 'summary', 'details']) || 'Connect to learn more about this profile.'
            })).filter(profile => profile.name);
            if (!profiles.length) throw new Error('No profiles with a name were found in Sheet1.');

            win.sampleProfiles = profiles;
            const addOptions = (selector, values) => {
              const select = doc.querySelector(selector);
              if (!select) return;
              const known = new Set(Array.from(select.options, option => option.value.toLowerCase()));
              values.forEach(value => {
                if (!known.has(value.toLowerCase())) select.add(new win.Option(value, value));
              });
            };
            addOptions('#typeFilter', [...new Set(profiles.map(profile => profile.type))]);
            addOptions('#industryFilter', [...new Set(profiles.map(profile => profile.industry))]);
            addOptions('#recIndustry', [...new Set(profiles.map(profile => profile.industry))]);
            addOptions('#recLocation', [...new Set(profiles.map(profile => profile.location))]);
            win.renderProfiles();
            win.renderRecommendations();
            if (typeof win.setupWatchlist === 'function') win.setupWatchlist();
          }).catch(error => {
            const list = doc.querySelector('#profilesList');
            if (list) list.innerHTML = '<div class="empty">' + escapeHTML(error.message || 'Could not load network profiles.') + '</div>';
          });

          const resize = () => {
            frame.style.height = `${Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight)}px`;
          };
          resize();
          new ResizeObserver(resize).observe(doc.documentElement);
        } catch (error) {
          showLoadError();
        }
      }, {once:true});
      frame.srcdoc = html;
    }).catch(showLoadError);
  </script>
</body>
</html>
