<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b4e">
  <title>VentureLink | Build the right connections</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f8fb}iframe{display:block;width:100%;min-height:100vh;border:0}
    #loadError{display:none;max-width:680px;margin:12vh auto;padding:24px;color:#172b45;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;border:1px solid #e1e8f1;border-radius:14px}
  </style>
</head>
<body>
  <iframe id="website" title="VentureLink website"></iframe>
  <main id="loadError" role="alert"><h1>VentureLink could not load</h1><p>Please refresh this page or check your internet connection.</p></main>
  <script>
    // Start from the complete VentureLink demo and add the inbox as a normal
    // in-page view. No modal overlay or external personal-data lookup is used.
    const source = 'https://raw.githubusercontent.com/chking3811-sudo/MCFai/458e8ee1afe7129313867584096341304b73ee7f/VentureLink_Updated_v3.html';
    const frame = document.querySelector('#website');
    const showLoadError = () => {
      frame.hidden = true;
      document.querySelector('#loadError').style.display = 'block';
    };

    fetch(source).then(response => {
      if (!response.ok) throw new Error('Website source unavailable');
      return response.text();
    }).then(html => {
      // Continue loading the network directory from the site's configured sheet.
      html = html.replace(/const sampleProfiles=\[[\s\S]*?\n\s*\];/, 'let sampleProfiles = [];');
      html = html.replace('</body>', `
        <script>
          (async function replaceProfilesWithSheetData() {
            const normalize = value => String(value ?? '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            const getField = (row, candidates) => {
              const entries = Object.entries(row || {});
              for (const candidate of candidates) {
                const match = entries.find(([key]) => normalize(key) === normalize(candidate));
                if (match) {
                  const value = String(match[1] ?? '').trim();
                  if (value) return value;
                }
              }
              return '';
            };
            try {
              const response = await fetch('https://sheetdb.io/api/v1/tp4g3dvbqo7ro?sheet=Sheet1');
              if (!response.ok) throw new Error('Unable to load network profiles.');
              const rows = await response.json();
              if (!Array.isArray(rows) || !rows.length) throw new Error('No records returned from the SheetDB data source.');
              sampleProfiles = rows.map((row, index) => ({
                id: getField(row, ['id', 'profile id', 'business id']) || \\`sheet-\\${index}\\`,
                name: getField(row, ['name', 'company name', 'business name', 'organization', 'full name']) || 'Unnamed profile',
                type: getField(row, ['type', 'connection type', 'profile type', 'role', 'category']) || 'Connection',
                industry: getField(row, ['industry', 'sector', 'business industry']) || 'Other',
                location: getField(row, ['location', 'city', 'address', 'region']) || 'Not specified',
                description: getField(row, ['description', 'about', 'bio', 'summary', 'details']) || 'Connect to learn more about this profile.'
              })).filter(item => item.name);
              if (!sampleProfiles.length) throw new Error('No valid profile names were returned from Sheet1.');
              const setOptions = (selector, values) => {
                const select = document.querySelector(selector);
                if (!select) return;
                const seen = new Set(Array.from(select.options).map(option => option.value.toLowerCase()));
                values.forEach(value => { if (!seen.has(String(value).toLowerCase())) { select.add(new Option(value, value)); seen.add(String(value).toLowerCase()); } });
              };
              setOptions('#typeFilter', [...new Set(sampleProfiles.map(item => item.type))]);
              setOptions('#industryFilter', [...new Set(sampleProfiles.map(item => item.industry))]);
              setOptions('#recIndustry', [...new Set(sampleProfiles.map(item => item.industry))]);
              setOptions('#recLocation', [...new Set(sampleProfiles.map(item => item.location))]);
              renderProfiles();
              renderRecommendations();
              if (typeof setupWatchlist === 'function') setupWatchlist();
            } catch (error) {
              const list = document.querySelector('#profilesList');
              if (list) list.innerHTML = '<div class="empty">' + String(error.message || 'Could not load profiles.') + '</div>';
            }
          })();
        <\\/script>\n</body>`);

      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          const oldInboxButton = doc.querySelector('#inboxBtn');
          const nav = doc.querySelector('.navlinks');
          const main = doc.querySelector('main');
          const hero = doc.querySelector('.hero');
          if (!oldInboxButton || !nav || !main || !hero) throw new Error('Website navigation unavailable');
          oldInboxButton.remove();

          const messagingLink = doc.createElement('a');
          messagingLink.href = '#messaging';
          messagingLink.textContent = 'Messaging';
          messagingLink.id = 'messagingNavLink';
          nav.append(messagingLink);

          const style = doc.createElement('style');
          style.textContent = `
            #messaging{display:none;min-height:560px;padding:24px 0 42px;scroll-margin-top:76px}
            #messaging .msg-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 18px}
            #messaging h2{margin:0;font-size:26px;color:#172b45}
            #messaging .msg-subtitle{margin:4px 0 0;color:#687991;font-size:13px}
            #messaging .msg-new-btn,#messaging .msg-send-btn{border:0;border-radius:9px;padding:10px 15px;background:#2869bd;color:#fff;font:inherit;font-weight:750;cursor:pointer}
            #messaging .msg-layout{display:grid;grid-template-columns:minmax(245px, .75fr) minmax(0,1.5fr);min-height:500px;background:#fff;border:1px solid #e1e8f1;border-radius:15px;overflow:hidden;box-shadow:0 5px 22px #102b4e0a}
            #messaging .msg-sidebar{border-right:1px solid #e1e8f1;min-width:0}
            #messaging .msg-sidebar-head{padding:18px 16px 12px;border-bottom:1px solid #e1e8f1}
            #messaging .msg-sidebar-head h3{margin:0 0 12px;color:#172b45}
            #messaging .msg-search,#messaging .msg-new-form input,#messaging .msg-compose textarea{width:100%;border:1px solid #d5deea;border-radius:9px;padding:10px 12px;background:#fff;color:#172b45;font:inherit}
            #messaging .msg-search{background:#f6f8fb}
            #messaging .msg-conversation-list{max-height:440px;overflow:auto}
            #messaging .msg-conversation{display:flex;width:100%;gap:11px;align-items:center;text-align:left;border:0;border-bottom:1px solid #f0f3f7;background:#fff;padding:14px 15px;cursor:pointer;color:#172b45}
            #messaging .msg-conversation:hover,#messaging .msg-conversation.active{background:#f0f6ff}
            #messaging .msg-avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:#eaf2fc;color:#2869bd;font-weight:800}
            #messaging .msg-contact-info{min-width:0;flex:1}
            #messaging .msg-contact-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            #messaging .msg-preview{font-size:12px;color:#687991;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
            #messaging .msg-chat{display:flex;flex-direction:column;min-width:0;min-height:500px}
            #messaging .msg-chat-head{padding:15px 19px;border-bottom:1px solid #e1e8f1;font-weight:750;color:#172b45;min-height:58px}
            #messaging .msg-chat-body{flex:1;overflow:auto;max-height:365px;padding:18px;display:flex;flex-direction:column;gap:10px;background:#fff}
            #messaging .msg-empty{margin:auto;max-width:300px;text-align:center;color:#687991;font-size:14px;padding:24px}
            #messaging .msg-empty strong{display:block;color:#172b45;font-size:18px;margin-bottom:5px}
            #messaging .msg-bubble{max-width:min(78%,520px);border-radius:16px;padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
            #messaging .msg-bubble.mine{align-self:flex-end;background:#2869bd;color:#fff;border-bottom-right-radius:5px}
            #messaging .msg-bubble.theirs{align-self:flex-start;background:#f0f2f5;color:#172b45;border-bottom-left-radius:5px}
            #messaging .msg-time{display:block;margin-top:4px;font-size:10px;opacity:.72}
            #messaging .msg-compose{display:flex;align-items:flex-end;gap:10px;padding:13px;border-top:1px solid #e1e8f1}
            #messaging .msg-compose textarea{min-height:42px;max-height:115px;resize:vertical}
            #messaging .msg-compose button{flex:none}
            #messaging .msg-new-form{display:none;padding:17px;border-bottom:1px solid #e1e8f1;background:#fbfcfe}
            #messaging .msg-new-form label{display:block;margin:9px 0 4px;font-size:12px;font-weight:700;color:#52647b}
            #messaging .msg-new-form .msg-help{font-size:12px;color:#687991;margin:0 0 8px}
            #messaging .msg-new-form .msg-start-btn{border:0;border-radius:8px;padding:9px 13px;background:#2869bd;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}
            #messaging .msg-status{min-height:19px;color:#687991;font-size:12px;padding:0 14px}
            body.messaging-view .hero,body.messaging-view main>.section:not(#messaging){display:none!important}
            body.messaging-view #messaging{display:block!important}
            body.messaging-view #messagingNavLink{color:#2869bd;font-weight:800}
            body.messaging-view footer{margin-top:0}
            @media(max-width:700px){#messaging .msg-layout{grid-template-columns:1fr;min-height:0}#messaging .msg-sidebar{border-right:0;border-bottom:1px solid #e1e8f1}#messaging .msg-conversation-list{max-height:210px}#messaging .msg-chat{min-height:380px}#messaging .msg-chat-body{max-height:300px}#messaging .msg-heading{align-items:flex-start}#messaging .msg-heading h2{font-size:23px}}
          `;
          doc.head.append(style);

          const messaging = doc.createElement('section');
          messaging.id = 'messaging';
          messaging.className = 'section';
          messaging.innerHTML = `
            <div class="msg-heading">
              <div><h2>Messages</h2><p class="msg-subtitle">Your conversations, all in one place.</p></div>
              <button type="button" class="msg-new-btn" id="msgNewChat">＋ New chat</button>
            </div>
            <div class="msg-layout">
              <aside class="msg-sidebar" aria-label="Inbox conversations">
                <div class="msg-sidebar-head"><h3>Inbox</h3><input class="msg-search" id="msgSearch" type="search" placeholder="Search conversations" aria-label="Search conversations"></div>
                <form class="msg-new-form" id="msgNewForm">
                  <p class="msg-help">Start a local demo chat. To exchange messages across accounts, the site needs a configured messaging backend.</p>
                  <label for="msgNewName">Name</label><input id="msgNewName" required maxlength="100" placeholder="Person or business name">
                  <label for="msgNewContact">Email or phone (optional)</label><input id="msgNewContact" maxlength="254" placeholder="Contact detail you already have">
                  <button type="submit" class="msg-start-btn">Create chat</button>
                </form>
                <div id="msgConversationList" class="msg-conversation-list" aria-live="polite"></div>
              </aside>
              <section class="msg-chat" aria-label="Conversation">
                <div id="msgChatHeader" class="msg-chat-head">Select a conversation</div>
                <div id="msgChatBody" class="msg-chat-body"><div class="msg-empty"><strong>Your inbox</strong>Choose a chat or press “New chat” to start one.</div></div>
                <form id="msgComposeForm" class="msg-compose" style="display:none"><textarea id="msgComposeInput" maxlength="5000" required placeholder="Write a message…" aria-label="Write a message"></textarea><button type="submit" class="msg-send-btn">Send</button></form>
                <div id="msgStatus" class="msg-status" role="status" aria-live="polite">Demo chats are saved only in this browser.</div>
              </section>
            </div>`;
          main.append(messaging);

          const key = 'venturelink_conversations_v1';
          const safeText = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
          const loadChats = () => {
            try {
              const value = JSON.parse(frame.contentWindow.localStorage.getItem(key) || '[]');
              return Array.isArray(value) ? value.filter(chat => chat && chat.id && chat.name && Array.isArray(chat.messages)) : [];
            } catch (_) { return []; }
          };
          const saveChats = chats => {
            try { frame.contentWindow.localStorage.setItem(key, JSON.stringify(chats)); return true; }
            catch (_) { return false; }
          };
          let activeChatId = null;
          const chatList = messaging.querySelector('#msgConversationList');
          const chatBody = messaging.querySelector('#msgChatBody');
          const chatHeader = messaging.querySelector('#msgChatHeader');
          const composeForm = messaging.querySelector('#msgComposeForm');
          const newForm = messaging.querySelector('#msgNewForm');

          const renderChatList = () => {
            const query = messaging.querySelector('#msgSearch').value.trim().toLowerCase();
            const chats = loadChats().filter(chat => `${chat.name} ${chat.contact || ''}`.toLowerCase().includes(query));
            if (!chats.length) {
              chatList.innerHTML = `<div class="msg-empty">${query ? 'No matching conversations.' : 'No conversations yet. Press “New chat” to get started.'}</div>`;
              return;
            }
            chatList.innerHTML = chats.map(chat => {
              const last = chat.messages[chat.messages.length - 1];
              const initials = chat.name.trim().split(/\\s+/).slice(0,2).map(part => part[0] || '').join('').toUpperCase();
              return `<button type="button" class="msg-conversation ${chat.id === activeChatId ? 'active' : ''}" data-chat-id="${safeText(chat.id)}"><span class="msg-avatar">${safeText(initials || 'V')}</span><span class="msg-contact-info"><span class="msg-contact-name">${safeText(chat.name)}</span><span class="msg-preview">${safeText(last ? last.text : chat.contact || 'Start a conversation')}</span></span></button>`;
            }).join('');
          };

          const openChat = id => {
            const chat = loadChats().find(item => item.id === id);
            if (!chat) return;
            activeChatId = id;
            chatHeader.textContent = chat.name;
            chatBody.innerHTML = chat.messages.length ? chat.messages.map(message => `<div class="msg-bubble ${message.from === 'me' ? 'mine' : 'theirs'}">${safeText(message.text)}<span class="msg-time">${safeText(new Date(message.at).toLocaleString())}</span></div>`).join('') : '<div class="msg-empty"><strong>Say hello</strong>This is the beginning of your conversation.</div>';
            composeForm.style.display = 'flex';
            chatBody.scrollTop = chatBody.scrollHeight;
            renderChatList();
          };

          messaging.querySelector('#msgNewChat').addEventListener('click', () => {
            const isOpen = newForm.style.display === 'block';
            newForm.style.display = isOpen ? 'none' : 'block';
            if (!isOpen) messaging.querySelector('#msgNewName').focus();
          });
          newForm.addEventListener('submit', event => {
            event.preventDefault();
            const name = messaging.querySelector('#msgNewName').value.trim();
            const contact = messaging.querySelector('#msgNewContact').value.trim();
            if (!name) return;
            const chats = loadChats();
            const existing = chats.find(chat => chat.name.toLowerCase() === name.toLowerCase() && (chat.contact || '') === contact);
            if (existing) {
              activeChatId = existing.id;
              openChat(existing.id);
            } else {
              const chat = {id:`chat-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,name,contact,messages:[],updatedAt:Date.now()};
              chats.unshift(chat);
              if (!saveChats(chats)) {
                messaging.querySelector('#msgStatus').textContent = 'Could not save this chat in browser storage.';
                return;
              }
              activeChatId = chat.id;
              openChat(chat.id);
            }
            newForm.reset();
            newForm.style.display = 'none';
            messaging.querySelector('#msgComposeInput').focus();
            messaging.querySelector('#msgStatus').textContent = 'Chat created. Messages in this demo stay in this browser.';
          });
          chatList.addEventListener('click', event => {
            const item = event.target.closest('[data-chat-id]');
            if (item) openChat(item.dataset.chatId);
          });
          messaging.querySelector('#msgSearch').addEventListener('input', renderChatList);
          composeForm.addEventListener('submit', event => {
            event.preventDefault();
            const text = messaging.querySelector('#msgComposeInput').value.trim();
            if (!text || !activeChatId) return;
            const chats = loadChats();
            const chat = chats.find(item => item.id === activeChatId);
            if (!chat) return;
            chat.messages.push({id:`msg-${Date.now()}`,text,from:'me',at:new Date().toISOString()});
            chat.updatedAt = Date.now();
            chats.sort((a,b) => b.updatedAt - a.updatedAt);
            if (!saveChats(chats)) {
              messaging.querySelector('#msgStatus').textContent = 'Could not save this message in browser storage.';
              return;
            }
            composeForm.reset();
            openChat(chat.id);
            messaging.querySelector('#msgStatus').textContent = 'Message saved in this browser. It was not delivered to another person.';
            messaging.querySelector('#msgComposeInput').focus();
          });

          const showMessaging = () => {
            doc.body.classList.add('messaging-view');
            renderChatList();
            messaging.scrollIntoView({behavior:'smooth',block:'start'});
          };
          const showWebsiteSection = link => {
            doc.body.classList.remove('messaging-view');
            const target = doc.querySelector(link.getAttribute('href'));
            if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
          };
          messagingLink.addEventListener('click', event => { event.preventDefault(); showMessaging(); });
          nav.querySelectorAll('a[href^="#"]:not(#messagingNavLink)').forEach(link => link.addEventListener('click', event => {
            event.preventDefault();
            showWebsiteSection(link);
          }));

          renderChatList();
          const resize = () => { frame.style.height = `${Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight)}px`; };
          resize();
          new ResizeObserver(resize).observe(doc.documentElement);
        } catch (error) {
          showLoadError();
        }
      }, {once:true});
      frame.srcdoc = html;
    }).catch(showLoadError);
  </script>
</body>
</html>
