<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b4e">
  <title>VentureLink</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fb}
    #site{display:block;width:100%;height:100vh;height:100dvh;border:0}
    #loadError{display:none;margin:24px;padding:20px;border:1px solid #e1e8f1;border-radius:12px;background:#fff;color:#172b45;font:16px/1.5 system-ui,sans-serif}
  </style>
</head>
<body>
  <iframe id="site" title="VentureLink"></iframe>
  <main id="loadError" role="alert"><h1>VentureLink could not load</h1><p>Refresh the page and try again.</p></main>
  <script>
    // Keep the existing website and its scripts intact; only add scrolling
    // behavior to the inbox modal so its entire content remains reachable.
    const source = 'https://raw.githubusercontent.com/chking3811-sudo/MCFai/17eab31b2ab738c2150ef6b64b1de0a728a4a4ef/VentureLink_Updated_v3.html';
    const frame = document.querySelector('#site');
    const showError = () => {
      frame.hidden = true;
      document.querySelector('#loadError').style.display = 'block';
    };

    fetch(source)
      .then(response => {
        if (!response.ok) throw new Error('Unable to load the VentureLink page.');
        return response.text();
      })
      .then(html => {
        frame.addEventListener('load', () => {
          try {
            const doc = frame.contentDocument;
            if (!doc || !doc.querySelector('#modal')) throw new Error('Inbox modal is missing.');
            const fix = doc.createElement('style');
            fix.textContent = `
              /* Make the overlay independently scrollable on short screens. */
              #modal.modal {
                position: fixed !important;
                inset: 0 !important;
                overflow-y: auto !important;
                overflow-x: hidden !important;
                align-items: flex-start !important;
                justify-content: center !important;
                padding: 16px 12px max(20px, env(safe-area-inset-bottom)) !important;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
              }
              #modal.modal.show { display: flex !important; }
              #modal .dialog {
                width: min(950px, 100%) !important;
                max-height: calc(100vh - 32px) !important;
                max-height: calc(100dvh - 32px) !important;
                margin: 0 auto !important;
                overflow-y: auto !important;
                overflow-x: hidden !important;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
              }
              #modal .dialog-close { position: sticky; top: 0; z-index: 3; }
              @media (max-width: 600px) {
                #modal.modal { padding: 8px 8px max(12px, env(safe-area-inset-bottom)) !important; }
                #modal .dialog { max-height: calc(100vh - 16px) !important; max-height: calc(100dvh - 16px) !important; padding: 18px !important; }
              }
            `;
            doc.head.append(fix);
          } catch (_) {
            showError();
          }
        }, {once:true});
        frame.srcdoc = html;
      })
      .catch(showError);
  </script>
</body>
</html>
